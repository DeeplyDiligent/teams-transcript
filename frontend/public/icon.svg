<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#818CF8;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Sound waves -->
  <path d="M 120 256 Q 140 200, 160 256 T 200 256" stroke="url(#waveGrad)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M 120 280 Q 140 340, 160 280 T 200 280" stroke="url(#waveGrad)" stroke-width="16" fill="none" stroke-linecap="round"/>
  
  <!-- Chat bubble with captions -->
  <rect x="220" y="140" width="240" height="240" rx="40" fill="white" opacity="0.95"/>
  
  <!-- Caption lines -->
  <rect x="260" y="190" width="160" height="16" rx="8" fill="#3B82F6"/>
  <rect x="260" y="230" width="120" height="16" rx="8" fill="#6366F1"/>
  <rect x="260" y="270" width="140" height="16" rx="8" fill="#3B82F6"/>
  <rect x="260" y="310" width="100" height="16" rx="8" fill="#6366F1"/>
  
  <!-- Microphone icon -->
  <circle cx="380" cy="340" r="30" fill="#10B981"/>
  <rect x="370" y="325" width="20" height="30" rx="10" fill="white"/>
  <rect x="375" y="355" width="10" height="15" fill="white"/>
  <path d="M 360 370 L 400 370" stroke="white" stroke-width="6" stroke-linecap="round"/>
</svg>
